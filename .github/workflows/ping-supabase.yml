name: Keep Supabase Alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query passwords table
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/passwords?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Prefer: count=exact")
          if [ "$STATUS" != "200" ]; then
            echo "Supabase ping failed with status $STATUS"
            exit 1
          fi
          echo "Supabase is active (HTTP $STATUS)"

      - name: Keepalive - prevent GitHub from disabling scheduled workflows
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}"
          LAST=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "$API/commits?per_page=1")
          DATE=$(echo "$LAST" | jq -r '.[0].commit.committer.date')
          AGE_DAYS=$(( ($(date +%s) - $(date -d "$DATE" +%s)) / 86400 ))
          echo "Last commit: $AGE_DAYS day(s) ago"
          if [ "$AGE_DAYS" -lt 50 ]; then
            echo "Repository still active - no keepalive commit needed"
            exit 0
          fi
          SHA=$(echo "$LAST" | jq -r '.[0].sha')
          TREE=$(echo "$LAST" | jq -r '.[0].commit.tree.sha')
          BRANCH="${{ github.ref_name }}"
          NEW=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/git/commits" \
            -d "{\"message\":\"chore: keepalive\",\"tree\":\"$TREE\",\"parents\":[\"$SHA\"]}" | jq -r '.sha')
          curl -sf -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/git/refs/heads/$BRANCH" \
            -d "{\"sha\":\"$NEW\"}" > /dev/null
          echo "Empty commit $NEW pushed to $BRANCH"
