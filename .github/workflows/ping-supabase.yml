name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive - prevent GitHub from disabling scheduled workflows
        uses: gautamkrishnar/keepalive-workflow@v2

      - name: Query passwords table
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/passwords?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          if [ "$STATUS" != "200" ]; then
            echo "Supabase ping failed with status $STATUS"
            exit 1
          fi
          echo "Supabase is active (HTTP $STATUS)"
